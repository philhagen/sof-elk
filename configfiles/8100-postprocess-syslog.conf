# This file contains postprocessing for syslog log messages

filter {
  if [labels][type] == "syslog" {
    # de-duplicate the [log][syslog][hostname] array
    ruby {
        code => "
        a = event.get('[log][syslog][hostname]')
        if a.is_a? Array
            event.remove('[log][syslog][hostname]')
            event.set('log.syslog.hostname', a.uniq)
        end"
    }
  }
}
