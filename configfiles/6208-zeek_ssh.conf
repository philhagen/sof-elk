# Reference: https://docs.zeek.org/en/master/scripts/base/protocols/ssh/main.zeek.html#type-SSH::Info

filter {
  if [labels][type] == "zeek_ssh" and "zeek_json" in [tags] {
    mutate {
      rename => {
        "[raw][uid]" => "[zeek][session_id]"
        "[raw][id.orig_h]" => "[source][ip]"
        "[raw][id.orig_p]" => "[source][port]"
        "[raw][id.resp_h]" => "[destination][ip]"
        "[raw][id.resp_p]" => "[destination][port]"
        "[raw][version]" => "[ssh][version]"
        "[raw][auth_success]" => "[ssh][auth_success]"
        "[raw][auth_attempts]" => "[ssh][auth_attempts]"
        "[raw][direction]" => "[ssh][direction]"
        "[raw][client]" => "[ssh][client]"
        "[raw][server]" => "[ssh][server]"
      }
    }

    # populate the @timestamp field with the ts value
    date {
      match => [ "[raw][ts]", "UNIX" ]
    }

    mutate {
      remove_field => "raw"
    }
  }
}

