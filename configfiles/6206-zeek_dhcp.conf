# Reference: https://docs.zeek.org/en/master/scripts/base/protocols/dhcp/main.zeek.html#type-DHCP::Info

filter {
  if [labels][type] == "zeek_dhcp" and "zeek_json" in [tags] {
    mutate {
      rename => {
        "[raw][uid]" => "[zeek][session_id]"
        "[raw][client_addr]" => "[client][ip]"
        "[raw][server_addr]" => "[client][port]"
        "[raw][client_port]" => "[server][ip]"
        "[raw][server_port]" => "[server][port]"
        "[raw][mac]" => "[client][mac]"
        "[raw][host_name]" => "[zeek][dhcp][hostname]"
        "[raw][client_fqdn]" => "[zeek][dhcp][client_fqdn]"
        "[raw][domain]" => "[zeek][dhcp][domain]"
        "[raw][requested_addr]" => "[requested][ip]"
        "[raw][assigned_addr]" => "[assigned][ip]"
        "[raw][lease_time]" => "[zeek][dhcp][lease_time]"
        "[raw][client_message]" => "[zeek][dhcp][client][message]"
        "[raw][server_message]" => "[zeek][dhcp][server][message]"
        "[raw][msg_types]" => "[dhcp][message_type]"
        "[raw][duration]" => "[zeek][dhcp][duration]"
      }
    }

    # populate the @timestamp field with the ts value
    date {
      match => [ "[raw][ts]", "UNIX" ]
    }

    mutate {
      # dhcp is always UDP - this allows the community-id to be added downstream
      add_field => { "[network][transport]" => "tcp" }
      remove_field => "raw"
    }
  }
}
