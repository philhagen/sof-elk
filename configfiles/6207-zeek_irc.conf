# Reference: https://docs.zeek.org/en/master/scripts/base/protocols/irc/main.zeek.html#type-IRC::Info

filter {
  if [labels][type] == "zeek_irc" and "zeek_json" in [tags] {
    mutate {
      rename => {
        "[raw][uid]" => "[zeek][session_id]"
        "[raw][id.orig_h]" => "[source][ip]"
        "[raw][id.orig_p]" => "[source][port]"
        "[raw][id.resp_h]" => "[destination][ip]"
        "[raw][id.resp_p]" => "[destination][port]"
        "[raw][nick]" => "[zeek][irc][nick]"
        "[raw][user]" => "[zeek][irc][user]"
        "[raw][command]" => "[zeek][irc][command]"
        "[raw][value]" => "[zeek][irc][value]"
        "[raw][addl]" => "[zeek][irc][addl]"
        "[raw][dcc_file_name]" => "[zeek][irc][dcc][file][name]"
        "[raw][dcc_file_size]" => "[zeek][irc][dcc][file][size]"
        "[raw][dcc_mime_type]" => "[zeek][irc][dcc][mime_type]"
        "[raw][fuid]" => "[zeek][irc][fuid]"
      }
    }

    # populate the @timestamp field with the ts value
    date {
      match => [ "[raw][ts]", "UNIX" ]
    }

    mutate {
      remove_field => "raw"
    }
  }
}
