# Reference: https://github.com/FoxIO-LLC/ja4/blob/main/zeek/scripts/fingerprints/ja4d/main.zeek

filter {
  if [labels][type] == "zeek_ja4d" and "zeek_json" in [tags] {
    mutate {
      rename => {
        "[raw][uid]" => "[zeek][session_id]"
        "[raw][id.orig_h]" => "[source][ip]"
        "[raw][id.orig_p]" => "[source][port]"
        "[raw][id.resp_h]" => "[destination][ip]"
        "[raw][id.resp_p]" => "[destination][port]"
        "[raw][ja4d]" => "[dhcp][ja4d]"
        "[raw][client_mac]" => "[client][mac]"
        "[raw][hostname]" => "[client][hostname]"
        "[raw][vendor_class_id]" => "[dhcp][vendor_class_id]"
        "[raw][requested_ip]" => "[requested][ip]"
      }
    }

    # populate the @timestamp field with the ts value
    date {
      match => [ "[raw][ts]", "UNIX" ]
    }

    mutate {
      remove_field => "raw"
    }
  }
}
