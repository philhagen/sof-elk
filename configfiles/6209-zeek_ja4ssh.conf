# Reference: https://github.com/FoxIO-LLC/ja4/blob/main/zeek/scripts/fingerprints/ja4ssh/main.zeek

filter {
  if [labels][type] == "zeek_ja4ssh" and "zeek_json" in [tags] {
    mutate {
      rename => {
        "[raw][uid]" => "[zeek][session_id]"
        "[raw][id.orig_h]" => "[source][ip]"
        "[raw][id.orig_p]" => "[source][port]"
        "[raw][id.resp_h]" => "[destination][ip]"
        "[raw][id.resp_p]" => "[destination][port]"
        "[raw][ja4ssh]" => "[ssh][ja4ssh]"
      }
    }

    # populate the @timestamp field with the ts value
    date {
      match => [ "[raw][ts]", "UNIX" ]
    }

    mutate {
      remove_field => "raw"
    }
  }
}
